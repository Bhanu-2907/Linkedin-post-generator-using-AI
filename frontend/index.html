<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkedIn AI Post Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- HEADER -->
        <header class="header">

            <div class="brand">
                <span class="brand-icon">✦</span>
                <span>LinkedIn AI</span>
            </div>

            <h1>LinkedIn Post Generator</h1>

            <p class="subtitle">
                Create engaging LinkedIn posts with AI
            </p>

        </header>


        <!-- TOPIC -->
        <section class="topic-section">

            <label for="topic">
                What do you want to post about?
            </label>

            <div class="topic-wrapper">

                <textarea
                    id="topic"
                    rows="5"
                    placeholder="Example: I completed my Python AI project..."></textarea>

                <!-- PLUS BUTTON -->
                <button
                    type="button"
                    id="imageToggle"
                    class="image-plus"
                    title="Add optional reference image">
                    +
                </button>

            </div>


            <!-- OPTIONAL IMAGE UPLOAD -->
            <div
                id="imageUploadArea"
                class="image-upload-area hidden">

                <div class="image-upload-header">

                    <div>
                        <h3>Reference Image</h3>

                        <p>
                            Optional — upload a LinkedIn post image
                            for AI to understand its writing style.
                        </p>
                    </div>

                    <button
                        type="button"
                        id="removeImage"
                        class="remove-image">
                        ×
                    </button>

                </div>


                <label class="upload-box">

                    <span class="upload-icon">🖼️</span>

                    <span class="upload-title">
                        Choose an image
                    </span>

                    <span class="upload-description">
                        PNG, JPG or JPEG
                    </span>

                    <input
                        type="file"
                        id="referenceImage"
                        accept="image/png,image/jpeg,image/jpg">

                </label>


                <div
                    id="imagePreview"
                    class="image-preview hidden">
                </div>

            </div>

        </section>


        <!-- POST OPTIONS -->
        <section class="form-row">

            <div class="form-group">

                <label for="postStyle">
                    Post Style
                </label>

                <select id="postStyle">

                    <option value="professional">
                        Professional
                    </option>

                    <option value="educational">
                        Educational
                    </option>

                    <option value="storytelling">
                        Storytelling
                    </option>

                    <option value="motivational">
                        Motivational
                    </option>

                    <option value="casual">
                        Casual
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="postLength">
                    Post Length
                </label>

                <select id="postLength">

                    <option value="short">
                        Short
                    </option>

                    <option value="medium" selected>
                        Medium
                    </option>

                    <option value="long">
                        Long
                    </option>

                </select>

            </div>

        </section>


        <!-- GENERATE -->
        <button
            id="generateButton"
            class="generate-button">

            ✨ Generate LinkedIn Post

        </button>


        <!-- LOADING -->
        <div
            id="loading"
            class="loading hidden">

            <div class="spinner"></div>

            <span>Generating your post...</span>

        </div>


        <!-- RESULT -->
        <section class="result-section">

            <h2>Generated Post</h2>

            <div
                id="postResult"
                class="post-result">

                <div class="empty-result">

                    <div class="empty-icon">✨</div>

                    <p>
                        Your generated LinkedIn post
                        will appear here.
                    </p>

                </div>

            </div>


            <button
                id="copyButton"
                class="copy-button">

                📋 Copy Post

            </button>

        </section>


        <!-- FOOTER -->
        <footer class="footer">

            Powered by
            <strong>FastAPI</strong>
            +
            <strong>Groq AI</strong>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
